NSA:
  C1:
    SRS:
      filename: nsasrsC1.a1_snowyear_2025.csv
      title: Sonic Ranging Sounders
      var_name: 
        - datetime
        - [air_temperature, air_temperature_2, air_temperature_3] 
        - [distance_1, distance_2, distance_3, distance_4, distance_5, distance_6, distance_7, distance_8, distance_9]
        - [data_quality_1, data_quality_2, data_quality_3, data_quality_4, data_quality_5, data_quality_6, data_quality_7, data_quality_8, data_quality_9]

    LPM:
      filename: nsalpmC1.a1_snowyear_2025.csv
      title: Laser Precipitation Monitor
      var_name: 
        - datetime
        - air_temperature
        - accum_precip
        - number_particles

    SPMF:
      filename: nsaspmfC1.a1_snowyear_2025.csv
      title: Solid Precipitation Mass Flux
      var_name:
        - datetime
        - mass_flux_top_mean
        - mass_flux_bottom_mean
        - wind_speed_top_mean
        - wind_speed_bottom_mean


    SONICWIND3D:
      filename: nsasonicwind3dC1.a1_snowyear_2025.csv
      title: Sonic Wind 3D
      var_name: 
        - datetime
        - u_wind
        - v_wind
        - w_wind

  E12:
